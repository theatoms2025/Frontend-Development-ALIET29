<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Fest</title>
</head>
<body>
    <p><em>Tech Fest</em> is on <strong>14th oct</strong></p>

    <a href="">TheAtoms</a>
    <a href="https://theatoms.in">TheAtoms</a>
    <img src="https://en.wikipedia.org/wiki/File:Virat_Kohli_during_the_India_vs_Aus_4th_Test_match_at_Narendra_Modi_Stadium_on_09_March_2023.jpg" alt="aliet">


    <div>
        <h3>Coding Contest</h3>
        <p>
            I am JS, currently building TheAtoms
        </p>
    </div>

    <span>Coding Contest
        <h1>Coding Contest</h1>
    </span>

    <table border="1px">
        <caption>Tech Fest Food</caption>
        <thead>
            <tr>
                <th>Item</th>
             <th>Price</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Samosa</td>
                <td>10</td>
            </tr>
            <tr>
                <td>Egg puff</td>
                <td>25</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th>Total</th>
                <th>35</th>
            </tr>
        </tfoot>
    </table>

    <br>
    <br>
    <br>

    <table border="1px">
        <tr>
            <th rowspan="2">Item</th>
            <th colspan="2">Price</th>
        </tr>
        <tr>
            <th>INR</th>
            <th>USD</th>
        </tr>
        <tr>
            <td>Frooti</td>
            <td>10</td>
            <td>0.14</td>
        </tr>
        <tr>
            <td>Chips</td>
            <td>15</td>
            <td>0.21</td>
        </tr>
    </table>



    <label>
        Enter you name: 
        <input type="text" placeholder="enter you name"> <br>
    </label>

    <input type="text" name="" id="">

    <label for="age">Age</label>
    <input type="text" id="age"> <br>
    
    <input type="password"> <br>
    <input type="number" name="" id=""><br>
    <input type="time" name="" id=""><br>
    <input type="color" name="" id=""><br>

    <form action="/register">
        <input type="text" name="username"> <br>
        <input type="number" name="age"> <br>
        <input  type="checkbox" name="adult" id="adult" value="true">
        <label for="adult">I am 18+</label><br>
        <button>Submit</button>
    </form>

    <br>
    <br>
    <h3>Lunch Coupon:</h3>
    <input type="radio" id="veg" name="lunch">
    <label for="veg">Veg</label>

    <input type="radio" id="nonveg" name="lunch">
    <label for="nonveg">Non Veg</label>
    
    <input type="radio" id="snacks" name="lunch">
    <label for="snacks">Snacks</label>
    
    <br>
    <form action="/register">
        <label for="profession">You are a</label>
        <select name="profession" id="profession">
            <option value="student" selected>Student</option>
            <option value="faculty" >Faculty</option>
        </select>
        <button>Submit</button>
    </form>


    <label for="rating">Rate the fest: </label>
    <input id="rating" type="range" min="0" max="10" step="1">

    <br>
        

    <label for="feedback">Feedback</label>
    <br>
    <textarea name="feedback" id="feedback" rows="5" cols="10"></textarea>
</body>
</html>
